<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CoEdit - 协作编辑器</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f7fa;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  
  .toolbar {
    background: white;
    padding: 12px 24px;
    border-bottom: 1px solid #e8ecf1;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .toolbar-left { display: flex; align-items: center; gap: 16px; }
  .toolbar-right { display: flex; align-items: center; gap: 12px; }
  .back-btn {
    color: #666;
    text-decoration: none;
    font-size: 14px;
  }
  .back-btn:hover { color: #4361ee; }
  .doc-title {
    font-size: 18px;
    font-weight: 600;
    color: #1a1a2e;
  }
  .version-badge {
    background: #e8ecf1;
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 12px;
    color: #666;
  }
  .status-indicator {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #999;
    display: inline-block;
    margin-right: 6px;
  }
  .status-indicator.connected { background: #2ecc71; }
  .status-indicator.disconnected { background: #e74c3c; }
  
  .users-panel {
    display: flex;
    gap: 8px;
  }
  .user-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 16px;
    font-size: 12px;
    background: white;
    border: 2px solid;
  }
  .user-chip .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }
  
  .editor-wrapper {
    flex: 1;
    display: flex;
    position: relative;
    overflow: hidden;
  }
  
  .cursors-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .remote-cursor {
    position: absolute;
    width: 2px;
    transition: top 0.15s, left 0.15s;
    z-index: 10;
  }
  .remote-cursor-label {
    position: absolute;
    top: -18px;
    left: -1px;
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 3px;
    color: white;
    white-space: nowrap;
  }
  
  #editor {
    width: 100%;
    height: 100%;
    padding: 32px 64px;
    font-size: 16px;
    line-height: 1.7;
    border: none;
    outline: none;
    resize: none;
    font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
    background: white;
  }
  
  .sidebar {
    width: 264px;
    background: white;
    border-left: 1px solid #e8ecf1;
    padding: 16px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sidebar h3 {
    font-size: 14px;
    color: #666;
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .sidebar p {
    font-size: 12px;
    color: #999;
    line-height: 1.6;
    margin-bottom: 8px;
  }

  /* ========== 大纲（自动目录） ========== */
  .outline-section {
    flex: 1 1 auto;
    min-height: 120px;
    display: flex;
    flex-direction: column;
  }
  .outline-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .outline-header h3 { margin-bottom: 0; }
  .outline-actions { display: flex; gap: 4px; }
  .outline-actions button {
    width: 20px;
    height: 20px;
    border: none;
    border-radius: 4px;
    background: transparent;
    color: #999;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
  }
  .outline-actions button:hover { background: #eef1f7; color: #4361ee; }
  .outline-list {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    margin: 0 -6px;
    padding: 0 6px;
  }
  .outline-empty {
    font-size: 12px;
    color: #999;
    line-height: 1.7;
    padding: 4px 2px;
  }
  .outline-item {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 3px 6px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    color: #555;
    white-space: nowrap;
    border-left: 2px solid transparent;
  }
  .outline-item:hover { background: #f0f2f8; }
  .outline-item.active {
    background: #e8edff;
    color: #4361ee;
    font-weight: 600;
    border-left-color: #4361ee;
  }
  .outline-item.level-1 .outline-title { font-weight: 600; color: #1a1a2e; }
  .outline-item.level-1.active .outline-title { color: #4361ee; }
  .outline-arrow {
    flex: none;
    width: 14px;
    font-size: 8px;
    color: #aaa;
    text-align: center;
    user-select: none;
    transition: transform 0.15s;
  }
  .outline-arrow.is-collapsed { transform: rotate(-90deg); }
  .outline-arrow.is-leaf { color: transparent; font-size: 6px; }
  .outline-title {
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sidebar-users {
    flex: none;
    max-height: 45%;
    overflow-y: auto;
    padding-top: 16px;
    border-top: 1px solid #f0f2f5;
  }
  
  .footer-bar {
    background: white;
    padding: 8px 24px;
    border-top: 1px solid #e8ecf1;
    font-size: 12px;
    color: #999;
    display: flex;
    justify-content: space-between;
  }
  
  .user-count {
    display: flex;
    align-items: center;
    gap: 6px;
  }
</style>
</head>
<body>

<div class="toolbar">
  <div class="toolbar-left">
    <a href="/" class="back-btn">← 返回文档列表</a>
    <div class="doc-title" id="docTitle">加载中...</div>
  </div>
  <div class="toolbar-right">
    <div class="version-badge">v<span id="version">0</span></div>
    <div class="status-indicator" id="status"></div>
    <span id="statusText">连接中...</span>
  </div>
</div>

<div class="editor-wrapper">
  <div class="cursors-layer" id="cursorsLayer"></div>
  <textarea id="editor" spellcheck="false" placeholder="开始输入..."></textarea>
  <div class="sidebar">
    <div class="outline-section">
      <div class="outline-header">
        <h3>大纲</h3>
        <div class="outline-actions">
          <button id="outlineExpandAll" title="全部展开">⌄</button>
          <button id="outlineCollapseAll" title="全部折叠">›</button>
        </div>
      </div>
      <div class="outline-list" id="outlineList"></div>
    </div>
    <div class="sidebar-users">
      <h3>在线用户</h3>
      <div class="users-panel" id="usersPanel"></div>
      <h3 style="margin-top:16px;">协作提示</h3>
      <p>👋 多人可以同时编辑此文档</p>
      <p>🎨 不同颜色代表不同用户的光标位置</p>
      <p>💾 所有更改自动保存到服务器</p>
      <p>🔄 支持版本历史和回滚</p>
      <p># 用 # 标记标题，大纲会自动更新</p>
    </div>
  </div>
</div>

<div class="footer-bar">
  <div class="user-count">
    👥 在线: <span id="userCount">0</span> 人
  </div>
  <div>CoEdit OT 实时协作引擎</div>
</div>

<script>
// ========== 状态管理 ==========
const params = new URLSearchParams(window.location.search);
const docId = params.get('doc_id');
const username = params.get('username') || '用户-' + Math.random().toString(36).slice(2, 6);

let state = {
  content: '',
  version: 0,
  clientId: null,
  color: '#4361ee',
  cursorPosition: 0,
  remoteCursors: {},
  users: [],
  ws: null,
  reconnectAttempts: 0,
  pendingOps: [],   // 本地已发送但未ack的操作
  sendTimer: null,
};

const editor = document.getElementById('editor');
const cursorsLayer = document.getElementById('cursorsLayer');
const versionEl = document.getElementById('version');
const statusEl = document.getElementById('status');
const statusText = document.getElementById('statusText');
const usersPanel = document.getElementById('usersPanel');
const userCount = document.getElementById('userCount');
const docTitle = document.getElementById('docTitle');
const outlineList = document.getElementById('outlineList');

// ========== 初始化 ==========
async function init() {
  // 加载文档
  await loadDocument();
  // 建立WebSocket连接
  connectWS();
  // 监听编辑事件
  editor.addEventListener('input', onInput);
  editor.addEventListener('keyup', onCursorMove);
  editor.addEventListener('mouseup', onCursorMove);
  editor.addEventListener('scroll', renderCursors);
  editor.addEventListener('scroll', updateActiveHeadingFromScroll);
  window.addEventListener('resize', renderCursors);
  window.addEventListener('resize', () => { invalidateHeadingTops(); updateActiveHeadingFromScroll(); });

  // 大纲：全部展开 / 全部折叠
  document.getElementById('outlineExpandAll').addEventListener('click', expandAllOutline);
  document.getElementById('outlineCollapseAll').addEventListener('click', collapseAllOutline);
}

async function loadDocument() {
  try {
    const res = await fetch(`/api/documents/${docId}/snapshot`);
    const data = await res.json();
    state.content = data.content || '';
    state.version = data.version || 0;
    editor.value = state.content;
    versionEl.textContent = state.version;
    
    // 获取文档标题
    const docRes = await fetch(`/api/documents/${docId}`);
    const docData = await docRes.json();
    docTitle.textContent = docData.title || '未命名文档';

    refreshOutline();
  } catch (e) {
    console.error('加载文档失败:', e);
  }
}

// ========== WebSocket ==========
function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const url = `${proto}//${location.host}/ws?doc_id=${docId}&username=${encodeURIComponent(username)}`;
  
  state.ws = new WebSocket(url);
  
  state.ws.onopen = () => {
    console.log('WebSocket 已连接');
    statusEl.className = 'status-indicator connected';
    statusText.textContent = '已连接';
    state.reconnectAttempts = 0;
  };
  
  state.ws.onclose = () => {
    console.log('WebSocket 断开');
    statusEl.className = 'status-indicator disconnected';
    statusText.textContent = '重连中...';
    // 自动重连
    setTimeout(() => {
      state.reconnectAttempts++;
      if (state.reconnectAttempts < 10) {
        connectWS();
      }
    }, Math.min(1000 * state.reconnectAttempts, 10000));
  };
  
  state.ws.onerror = (e) => {
    console.error('WebSocket 错误:', e);
  };
  
  state.ws.onmessage = onMessage;
}

function onMessage(event) {
  try {
    const msg = JSON.parse(event.data);
    
    switch (msg.type) {
      case 'init':
        handleInit(msg);
        break;
      case 'op':
        handleRemoteOp(msg);
        break;
      case 'ack':
        handleAck(msg);
        break;
      case 'cursor_move':
        handleCursorMove(msg);
        break;
      case 'user_join':
        handleUserJoin(msg);
        break;
      case 'user_leave':
        handleUserLeave(msg);
        break;
      case 'error':
        console.error('服务器错误:', msg.error);
        break;
    }
  } catch (e) {
    console.error('解析消息失败:', e);
  }
}

function handleInit(msg) {
  state.clientId = msg.client_id;
  state.color = msg.color;
  
  // 使用服务器的内容（可能比我们加载的更新）
  if (msg.content !== undefined) {
    state.content = msg.content;
    editor.value = msg.content;
    refreshOutline();
  }
  if (msg.version !== undefined) {
    state.version = msg.version;
    versionEl.textContent = msg.version;
  }
  
  // 添加已有用户
  if (msg.users) {
    state.users = msg.users.filter(u => u.client_id !== state.clientId);
    renderUsers();
  }
  
  // 渲染已有光标
  if (msg.cursors) {
    msg.cursors.forEach(c => {
      if (c.client_id !== state.clientId) {
        state.remoteCursors[c.client_id] = { ...c };
      }
    });
    renderCursors();
  }
  
  console.log('初始化完成, clientId:', state.clientId, 'version:', state.version);
}

function handleRemoteOp(msg) {
  // 接收来自其他客户端的操作
  const op = msg.op;
  console.log('收到远端op:', op, 'version:', msg.version);
  
  // 应用到本地
  applyOpToEditor(op);
  
  state.version = msg.version;
  versionEl.textContent = state.version;
}

function handleAck(msg) {
  // 服务器确认我们的操作
  console.log('收到ack, version:', msg.version);
  state.version = msg.version;
  versionEl.textContent = msg.version;
  // 清除对应的pang操作
  state.pendingOps = state.pendingOps.filter(o => o.version !== msg.version);
}

function handleCursorMove(msg) {
  if (msg.client_id === state.clientId) return;
  
  state.remoteCursors[msg.client_id] = {
    client_id: msg.client_id,
    username: msg.username,
    position: msg.position,
    color: msg.color
  };
  renderCursors();
}

function handleUserJoin(msg) {
  if (msg.client_id === state.clientId) return;
  
  if (!state.users.find(u => u.client_id === msg.client_id)) {
    state.users.push({
      client_id: msg.client_id,
      username: msg.username,
      color: msg.color
    });
  }
  renderUsers();
}

function handleUserLeave(msg) {
  state.users = state.users.filter(u => u.client_id !== msg.client_id);
  delete state.remoteCursors[msg.client_id];
  renderUsers();
  renderCursors();
}

// ========== 用户列表渲染 ==========
function renderUsers() {
  usersPanel.innerHTML = state.users.map(u => `
    <div class="user-chip" style="border-color:${u.color}">
      <div class="dot" style="background:${u.color}"></div>
      ${escapeHtml(u.username)}
    </div>
  `).join('');
  userCount.textContent = state.users.length + 1; // +1 自己
}

// ========== 光标渲染 ==========
function renderCursors() {
  // 清空
  cursorsLayer.innerHTML = '';
  
  Object.values(state.remoteCursors).forEach(cursor => {
    const pos = cursor.position;
    if (pos < 0 || pos > editor.value.length) return;
    
    // 计算位置（简化：按字符位置计算）
    const posInfo = getCaretCoordinates(editor, pos);
    
    const el = document.createElement('div');
    el.className = 'remote-cursor';
    el.style.background = cursor.color;
    el.style.top = posInfo.top + 'px';
    el.style.left = posInfo.left + 'px';
    el.style.height = posInfo.height + 'px';
    
    const label = document.createElement('div');
    label.className = 'remote-cursor-label';
    label.style.background = cursor.color;
    label.textContent = cursor.username;
    el.appendChild(label);
    
    cursorsLayer.appendChild(el);
  });
}

// 创建与 textarea 排版一致的镜像元素（用于计算字符像素位置）
function createMirrorElement() {
  const mirror = document.createElement('div');
  const style = window.getComputedStyle(editor);

  // 复制样式
  const props = ['boxSizing', 'width', 'height', 'overflowX', 'overflowY',
    'borderTopWidth', 'borderRightWidth', 'borderBottomWidth', 'borderLeftWidth',
    'borderStyle', 'paddingTop', 'paddingRight', 'paddingBottom', 'paddingLeft',
    'fontStyle', 'fontVariant', 'fontWeight', 'fontStretch', 'fontSize',
    'fontSizeAdjust', 'lineHeight', 'fontFamily',
    'textAlign', 'textTransform', 'textIndent', 'textDecoration',
    'letterSpacing', 'wordSpacing', 'tabSize'];

  props.forEach(p => {
    mirror.style[p] = style[p];
  });

  mirror.style.position = 'absolute';
  mirror.style.top = '0';
  mirror.style.left = '0';
  mirror.style.visibility = 'hidden';
  mirror.style.whiteSpace = 'pre-wrap';
  mirror.style.wordWrap = 'break-word';
  mirror.style.overflowWrap = 'break-word';

  return mirror;
}

// 获取光标在textarea中的像素位置
function getCaretCoordinates(element, position) {
  const mirror = createMirrorElement();
  const style = window.getComputedStyle(element);
  // 设置内容
  const text = element.value.substring(0, position);
  const afterText = element.value.substring(position);
  mirror.textContent = text;
  
  const span = document.createElement('span');
  span.textContent = afterText || '.';
  mirror.appendChild(span);
  
  document.body.appendChild(mirror);
  
  const rect = element.getBoundingClientRect();
  const mirrorRect = mirror.getBoundingClientRect();
  const spanRect = span.getBoundingClientRect();
  
  document.body.removeChild(mirror);
  
  return {
    top: spanRect.top - mirrorRect.top - element.scrollTop,
    left: spanRect.left - mirrorRect.left - element.scrollLeft,
    height: parseInt(style.lineHeight) || parseInt(style.fontSize) * 1.2,
    width: 2
  };
}

// ========== 编辑器操作 ==========
function onInput(e) {
  // 计算差异，发送OT操作
  const newContent = editor.value;
  const oldContent = state.content;
  
  if (newContent === oldContent) return;
  
  const op = diffContent(oldContent, newContent);
  if (!op) return;
  
  // 发送操作（带base_version）
  sendOp(op, state.version);
  state.content = newContent;
  // 标题增删或层级变化立刻反映到大纲
  refreshOutline();
}

function onCursorMove() {
  state.cursorPosition = editor.selectionStart;
  sendCursorPosition(state.cursorPosition);
  renderCursors();
}

function diffContent(oldContent, newContent) {
  // 简单的差异计算
  if (newContent.length > oldContent.length) {
    // 插入
    let diffStart = 0;
    while (diffStart < oldContent.length && diffStart < newContent.length) {
      if (oldContent[diffStart] !== newContent[diffStart]) break;
      diffStart++;
    }
    let diffEndOld = oldContent.length;
    let diffEndNew = newContent.length;
    while (diffEndOld > diffStart && diffEndNew > diffStart) {
      if (oldContent[diffEndOld - 1] !== newContent[diffEndNew - 1]) break;
      diffEndOld--;
      diffEndNew--;
    }
    
    // 在公共前缀之后有删除+插入
    const deletedText = oldContent.substring(diffStart, diffEndOld);
    const insertedText = newContent.substring(diffStart, diffEndNew);
    
    if (deletedText.length > 0) {
      return {
        operations: [
          { type: 'delete', position: diffStart, length: deletedText.length },
          { type: 'insert', position: diffStart, text: insertedText }
        ]
      };
    } else {
      return {
        operations: [
          { type: 'insert', position: diffStart, text: insertedText }
        ]
      };
    }
  } else if (newContent.length < oldContent.length) {
    // 删除
    let diffStart = 0;
    while (diffStart < oldContent.length && diffStart < newContent.length) {
      if (oldContent[diffStart] !== newContent[diffStart]) break;
      diffStart++;
    }
    
    let diffEndOld = oldContent.length;
    let diffEndNew = newContent.length;
    while (diffEndOld > diffStart && diffEndNew > diffStart) {
      if (oldContent[diffEndOld - 1] !== newContent[diffEndNew - 1]) break;
      diffEndOld--;
      diffEndNew--;
    }
    
    const deletedText = oldContent.substring(diffStart, diffEndOld);
    const insertedText = newContent.substring(diffStart, diffEndNew);
    
    if (insertedText.length > 0) {
      return {
        operations: [
          { type: 'delete', position: diffStart, length: deletedText.length },
          { type: 'insert', position: diffStart, text: insertedText }
        ]
      };
    } else {
      return {
        operations: [
          { type: 'delete', position: diffStart, length: deletedText.length }
        ]
      };
    }
  }
  return null;
}

function applyOpToEditor(op) {
  const operations = op.operations || [op];
  
  operations.forEach(o => {
    if (o.type === 'insert') {
      insertText(o.position, o.text);
    } else if (o.type === 'delete') {
      deleteText(o.position, o.length);
    }
  });

  state.content = editor.value;
  // 远端标题变更实时反映到本地大纲（多人协作同步）
  refreshOutline();
}

function insertText(pos, text) {
  const before = editor.value.substring(0, pos);
  const after = editor.value.substring(pos);
  editor.value = before + text + after;
}

function deleteText(pos, length) {
  const before = editor.value.substring(0, pos);
  const after = editor.value.substring(pos + length);
  editor.value = before + after;
}

function sendOp(op, baseVersion) {
  if (!state.ws || state.ws.readyState !== WebSocket.OPEN) return;
  
  const msg = {
    type: 'op',
    doc_id: docId,
    op: op.operations && op.operations.length === 1 ? op.operations[0] : op,
    base_version: baseVersion,
    version: baseVersion
  };
  
  // 如果是多操作序列，逐个发送
  if (op.operations && op.operations.length > 1) {
    op.operations.forEach((singleOp, i) => {
      const singleMsg = { ...msg, op: singleOp };
      state.ws.send(JSON.stringify(singleMsg));
    });
  } else {
    state.ws.send(JSON.stringify(msg));
  }
}

function sendCursorPosition(pos) {
  if (!state.ws || state.ws.readyState !== WebSocket.OPEN) return;
  
  const msg = {
    type: 'cursor_move',
    doc_id: docId,
    position: pos
  };
  state.ws.send(JSON.stringify(msg));
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

// ========== 大纲（自动目录） ==========
// 约定：Markdown ATX 标题语法，行首 1~6 个 # + 空格，如 "## 背景"
const outlineState = {
  headings: [],          // {id, level, text, offset}，按正文顺序
  collapsed: new Set(),  // 被折叠的标题 id
  activeId: null,        // 当前所在章节
  headingTops: null,     // 缓存：每个标题相对正文内容区的 y 坐标
  headingTopsFor: null,  // 缓存对应的正文内容
  ticking: false,
};

let outlineSeq = 0;

// 解析正文，提取标题及其在字符串中的偏移量
function parseHeadings(content) {
  const headings = [];
  const fenceRe = /^\s*(```+|~~~+)/;
  const lines = content.split('\n');
  let offset = 0;
  let inFence = false;
  let fenceMarker = null;

  for (const line of lines) {
    const fenceMatch = line.match(fenceRe);
    if (fenceMatch) {
      const marker = fenceMatch[1][0];
      const len = fenceMatch[1].length;
      if (!inFence) {
        inFence = true;
        fenceMarker = { marker, len };
      } else if (marker === fenceMarker.marker && len >= fenceMarker.len) {
        inFence = false;
        fenceMarker = null;
      }
    } else if (!inFence) {
      // 标记：行首最多 3 空格 + 1~6 个 #，# 后必须是空白或行尾（"##文字" 不算标题）
      const mk = line.match(/^ {0,3}(#{1,6})(?:[ \t]+(.*?))?$/);
      if (mk) {
        // 去掉结尾的闭合井号序列（如 "标题 ###"）
        const text = (mk[2] || '').replace(/[ \t]+#+[ \t]*$/, '').trim();
        if (text.length > 0) {
          headings.push({
            id: null,
            level: mk[1].length,
            text,
            offset,
          });
        }
      }
    }
    offset += line.length + 1;
  }
  return headings;
}

// 重新解析并按顺序匹配旧 id：未改动的标题（层级+文本一致）保持稳定身份，
// 因此折叠状态、当前高亮在增删/改层级后仍尽量保留
function reconcileHeadings() {
  const next = parseHeadings(editor.value);
  const old = outlineState.headings;
  let oi = 0;
  for (const h of next) {
    for (let i = oi; i < old.length; i++) {
      if (old[i].level === h.level && old[i].text === h.text) {
        h.id = old[i].id;
        oi = i + 1;
        break;
      }
    }
    if (h.id === null) h.id = 'h-' + (++outlineSeq);
  }
  outlineState.headings = next;
  invalidateHeadingTops();
}

// 构建层级森林（跳过的层级自动挂到最近的更高级节点）
function buildOutlineForest() {
  const roots = [];
  const stack = []; // {level, node}
  for (const h of outlineState.headings) {
    const node = { ...h, children: [] };
    while (stack.length && stack[stack.length - 1].level >= h.level) stack.pop();
    if (stack.length) stack[stack.length - 1].node.children.push(node);
    else roots.push(node);
    stack.push({ level: h.level, node });
  }
  return roots;
}

// 标题是否被某个已折叠的祖先隐藏
function isHidden(index) {
  const heading = outlineState.headings[index];
  for (let i = 0; i < index; i++) {
    const anc = outlineState.headings[i];
    if (anc.level < heading.level && outlineState.collapsed.has(anc.id)) return true;
  }
  return false;
}

function getAncestorIds(index) {
  const heading = outlineState.headings[index];
  const ids = [];
  for (let i = 0; i < index; i++) {
    if (outlineState.headings[i].level < heading.level) ids.push(outlineState.headings[i].id);
  }
  return ids;
}

// 编辑后/远端同步后刷新大纲
function refreshOutline() {
  const prevActive = outlineState.activeId;
  reconcileHeadings();
  const exists = outlineState.headings.some(h => h.id === prevActive);
  renderOutline(exists ? prevActive : null);
}

function renderOutline(preferActiveId) {
  const forest = buildOutlineForest();

  if (outlineState.headings.length === 0) {
    outlineList.innerHTML =
      '<div class="outline-empty">暂无标题<br>在行首输入 <code># </code> 加空格创建标题，支持 1~6 级</div>';
    outlineState.activeId = null;
    return;
  }

  // 计算可见的扁平条目
  const rows = [];
  const idIndex = new Map(outlineState.headings.map((h, i) => [h.id, i]));
  const walk = (nodes, depth) => {
    for (const node of nodes) {
      rows.push({ node, depth });
      const collapsed = outlineState.collapsed.has(node.id);
      if (!collapsed) walk(node.children, depth + 1);
    }
  };
  walk(forest, 0);

  // 确定高亮项
  let activeId = outlineState.activeId;
  if (activeId === null || !idIndex.has(activeId) || isHidden(idIndex.get(activeId))) {
    activeId = preferActiveId && idIndex.has(preferActiveId) ? preferActiveId : null;
    if (activeId === null) {
      // 退而求其次：正文光标上方最近的标题
      const caret = editor.selectionStart || 0;
      for (let i = outlineState.headings.length - 1; i >= 0; i--) {
        if (outlineState.headings[i].offset <= caret && !isHidden(i)) {
          activeId = outlineState.headings[i].id;
          break;
        }
      }
    }
  }
  outlineState.activeId = activeId;

  outlineList.innerHTML = '';
  for (const { node, depth } of rows) {
    outlineList.appendChild(createOutlineRow(node, depth, node.id === activeId));
  }

  if (activeId) scrollActiveOutlineIntoView();
}

function createOutlineRow(node, depth, active) {
  const item = document.createElement('div');
  item.className = `outline-item level-${node.level}${active ? ' active' : ''}`;
  item.dataset.id = node.id;
  item.style.paddingLeft = (6 + depth * 12) + 'px';
  item.title = node.text;

  const arrow = document.createElement('span');
  const hasChildren = node.children.length > 0;
  arrow.className = 'outline-arrow' +
    (hasChildren ? (outlineState.collapsed.has(node.id) ? ' is-collapsed' : '') : ' is-leaf');
  arrow.textContent = '▼';
  arrow.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!hasChildren) return;
    toggleCollapse(node.id);
  });

  const title = document.createElement('span');
  title.className = 'outline-title';
  title.textContent = node.text;

  item.appendChild(arrow);
  item.appendChild(title);
  item.addEventListener('click', () => jumpToHeading(node.id));
  return item;
}

function toggleCollapse(id) {
  if (outlineState.collapsed.has(id)) outlineState.collapsed.delete(id);
  else outlineState.collapsed.add(id);
  renderOutline(outlineState.activeId);
}

function expandAllOutline() {
  outlineState.collapsed.clear();
  renderOutline(outlineState.activeId);
}

function collapseAllOutline() {
  // 只折叠有子标题的节点；折叠后自动展开高亮项的祖先
  outlineState.collapsed.clear();
  outlineState.headings.forEach((h, i) => {
    if (outlineState.headings.some((o, j) => j > i && o.level > h.level)) {
      outlineState.collapsed.add(h.id);
    }
  });
  renderOutline(null);
  const active = findActiveHeadingId();
  if (active) setActiveHeading(active, { expandAncestors: true });
}

function setActiveHeading(id, { expandAncestors, scrollIntoView } = { expandAncestors: true, scrollIntoView: true }) {
  if (id === outlineState.activeId) return;
  outlineState.activeId = id;
  if (id === null) return;

  if (expandAncestors) {
    const idx = outlineState.headings.findIndex(h => h.id === id);
    if (idx >= 0) {
      let changed = false;
      for (const aid of getAncestorIds(idx)) {
        if (outlineState.collapsed.has(aid)) {
          outlineState.collapsed.delete(aid);
          changed = true;
        }
      }
      if (changed) {
        renderOutline(id);
        return;
      }
    }
  }

  outlineList.querySelectorAll('.outline-item').forEach(el => {
    el.classList.toggle('active', el.dataset.id === id);
  });
  if (scrollIntoView) scrollActiveOutlineIntoView();
}

function scrollActiveOutlineIntoView() {
  const el = outlineList.querySelector('.outline-item.active');
  if (el) el.scrollIntoView({ block: 'nearest' });
}

// ========== 大纲 ↔ 正文位置对齐 ==========
function invalidateHeadingTops() {
  outlineState.headingTops = null;
  outlineState.headingTopsFor = null;
}

// 一次镜像排版，批量测出所有标题相对正文内容区顶部的 y 坐标
function measureHeadingTops() {
  const content = editor.value;
  if (outlineState.headingTops && outlineState.headingTopsFor === content) {
    return outlineState.headingTops;
  }

  const mirror = createMirrorElement();
  const positions = outlineState.headings.map(h => h.offset);

  let html = '';
  let cursor = 0;
  positions.forEach((pos, k) => {
    html += escapeHtml(content.substring(cursor, pos));
    html += `<span data-h="${k}" style="display:inline">`;
    html += escapeHtml(content.charAt(pos) || '​');
    html += '</span>';
    cursor = pos + 1;
  });
  html += escapeHtml(content.substring(cursor));
  mirror.innerHTML = html;
  document.body.appendChild(mirror);

  const mirrorRect = mirror.getBoundingClientRect();
  const tops = {};
  mirror.querySelectorAll('span[data-h]').forEach(span => {
    const heading = outlineState.headings[Number(span.dataset.h)];
    tops[heading.id] = span.getBoundingClientRect().top - mirrorRect.top;
  });
  document.body.removeChild(mirror);

  outlineState.headingTops = tops;
  outlineState.headingTopsFor = content;
  return tops;
}

// 点击大纲条目：滚动正文并放置光标到标题行首
function jumpToHeading(id) {
  const heading = outlineState.headings.find(h => h.id === id);
  if (!heading) return;

  const tops = measureHeadingTops();
  const y = tops[id] || 0;
  editor.focus();
  editor.scrollTop = Math.max(0, y - 8);
  const pos = Math.min(heading.offset, editor.value.length);
  editor.setSelectionRange(pos, pos);
  state.cursorPosition = pos;
  sendCursorPosition(pos);
  renderCursors();
  setActiveHeading(id, { expandAncestors: false });
}

// 根据当前滚动位置找“当前章节”：视口顶部下方最近的标题
function findActiveHeadingId() {
  if (outlineState.headings.length === 0) return null;
  const tops = measureHeadingTops();
  const target = editor.scrollTop + editor.clientHeight * 0.15;
  let active = outlineState.headings[0].id;
  for (const h of outlineState.headings) {
    if ((tops[h.id] || 0) <= target) active = h.id;
    else break;
  }
  return active;
}

function updateActiveHeadingFromScroll() {
  if (outlineState.headings.length === 0) return;
  if (outlineState.ticking) return;
  outlineState.ticking = true;
  requestAnimationFrame(() => {
    outlineState.ticking = false;
    const id = findActiveHeadingId();
    if (id) setActiveHeading(id, { expandAncestors: true });
  });
}

// 启动
init();
</script>
</body>
</html>
