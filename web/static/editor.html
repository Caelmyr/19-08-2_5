<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CoEdit - 协作编辑器</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f7fa;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  
  .toolbar {
    background: white;
    padding: 12px 24px;
    border-bottom: 1px solid #e8ecf1;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .toolbar-left { display: flex; align-items: center; gap: 16px; }
  .toolbar-right { display: flex; align-items: center; gap: 12px; }
  .back-btn {
    color: #666;
    text-decoration: none;
    font-size: 14px;
  }
  .back-btn:hover { color: #4361ee; }
  .doc-title {
    font-size: 18px;
    font-weight: 600;
    color: #1a1a2e;
  }
  .version-badge {
    background: #e8ecf1;
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 12px;
    color: #666;
  }
  .status-indicator {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #999;
    display: inline-block;
    margin-right: 6px;
  }
  .status-indicator.connected { background: #2ecc71; }
  .status-indicator.disconnected { background: #e74c3c; }
  
  .users-panel {
    display: flex;
    gap: 8px;
  }
  .user-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 16px;
    font-size: 12px;
    background: white;
    border: 2px solid;
  }
  .user-chip .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }
  
  .editor-wrapper {
    flex: 1;
    display: flex;
    position: relative;
    overflow: hidden;
  }
  
  .cursors-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .remote-cursor {
    position: absolute;
    width: 2px;
    transition: top 0.15s, left 0.15s;
    z-index: 10;
  }
  .remote-cursor-label {
    position: absolute;
    top: -18px;
    left: -1px;
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 3px;
    color: white;
    white-space: nowrap;
  }
  
  #editor {
    width: 100%;
    height: 100%;
    padding: 32px 64px;
    font-size: 16px;
    line-height: 1.7;
    border: none;
    outline: none;
    resize: none;
    font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
    background: white;
  }
  
  .sidebar {
    width: 260px;
    background: white;
    border-left: 1px solid #e8ecf1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ========== 大纲面板 ========== */
  .outline-section {
    flex: 1 1 55%;
    min-height: 120px;
    display: flex;
    flex-direction: column;
    border-bottom: 1px solid #e8ecf1;
  }
  .outline-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px 8px;
  }
  .outline-header h3 {
    font-size: 14px;
    color: #666;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .outline-toggle-all {
    border: none;
    background: none;
    color: #999;
    font-size: 12px;
    cursor: pointer;
    padding: 2px 4px;
  }
  .outline-toggle-all:hover { color: #4361ee; }

  #outlinePanel {
    flex: 1;
    overflow-y: auto;
    padding: 4px 8px 12px;
  }
  .outline-empty {
    font-size: 12px;
    color: #aaa;
    line-height: 1.7;
    padding: 8px;
  }
  .outline-item {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 3px 6px;
    border-radius: 5px;
    font-size: 13px;
    line-height: 1.45;
    color: #444;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  .outline-item:hover { background: #f0f3ff; color: #4361ee; }
  .outline-item.active {
    background: #e8edff;
    color: #4361ee;
    font-weight: 600;
  }
  .outline-item.lvl-2 .outline-label { font-size: 12.5px; color: #555; }
  .outline-item.lvl-3 .outline-label { font-size: 12px; color: #777; }
  .outline-item.lvl-4 .outline-label,
  .outline-item.lvl-5 .outline-label,
  .outline-item.lvl-6 .outline-label { font-size: 12px; color: #888; }
  .outline-arrow {
    flex: none;
    width: 14px;
    height: 14px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    color: #999;
    transition: transform 0.15s;
  }
  .outline-arrow.collapsed { transform: rotate(-90deg); }
  .outline-arrow.leaf { color: #ccc; cursor: default; }
  .outline-item.hidden { display: none; }
  .outline-label {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .sidebar-bottom {
    flex: none;
    padding: 12px 16px 16px;
    overflow-y: auto;
    max-height: 45%;
  }
  .sidebar-bottom h3 {
    font-size: 14px;
    color: #666;
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .sidebar-bottom .users-panel {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 16px;
  }
  .sidebar-bottom .user-chip { align-self: flex-start; }
  .sidebar-bottom p {
    font-size: 12px;
    color: #999;
    line-height: 1.6;
    margin-bottom: 6px;
  }
  
  .footer-bar {
    background: white;
    padding: 8px 24px;
    border-top: 1px solid #e8ecf1;
    font-size: 12px;
    color: #999;
    display: flex;
    justify-content: space-between;
  }
  
  .user-count {
    display: flex;
    align-items: center;
    gap: 6px;
  }
</style>
</head>
<body>

<div class="toolbar">
  <div class="toolbar-left">
    <a href="/" class="back-btn">← 返回文档列表</a>
    <div class="doc-title" id="docTitle">加载中...</div>
  </div>
  <div class="toolbar-right">
    <div class="version-badge">v<span id="version">0</span></div>
    <div class="status-indicator" id="status"></div>
    <span id="statusText">连接中...</span>
  </div>
</div>

<div class="editor-wrapper">
  <div class="cursors-layer" id="cursorsLayer"></div>
  <textarea id="editor" spellcheck="false" placeholder="开始输入..."></textarea>
  <div class="sidebar">
    <div class="outline-section">
      <div class="outline-header">
        <h3>大纲</h3>
        <button class="outline-toggle-all" id="outlineToggleAll" title="全部展开/折叠"></button>
      </div>
      <div id="outlinePanel"></div>
    </div>
    <div class="sidebar-bottom">
      <h3>在线用户</h3>
      <div class="users-panel" id="usersPanel"></div>
      <h3>协作提示</h3>
      <p>👋 多人可以同时编辑此文档</p>
      <p>🎨 不同颜色代表不同用户的光标位置</p>
      <p>💾 所有更改自动保存到服务器</p>
      <p>🔄 支持版本历史和回滚</p>
    </div>
  </div>
</div>

<div class="footer-bar">
  <div class="user-count">
    👥 在线: <span id="userCount">0</span> 人
  </div>
  <div>CoEdit OT 实时协作引擎</div>
</div>

<script>
// ========== 状态管理 ==========
const params = new URLSearchParams(window.location.search);
const docId = params.get('doc_id');
const username = params.get('username') || '用户-' + Math.random().toString(36).slice(2, 6);

let state = {
  content: '',
  version: 0,
  clientId: null,
  color: '#4361ee',
  cursorPosition: 0,
  remoteCursors: {},
  users: [],
  ws: null,
  reconnectAttempts: 0,
  pendingOps: [],   // 本地已发送但未ack的操作
  sendTimer: null,
};

const editor = document.getElementById('editor');
const cursorsLayer = document.getElementById('cursorsLayer');
const versionEl = document.getElementById('version');
const statusEl = document.getElementById('status');
const statusText = document.getElementById('statusText');
const usersPanel = document.getElementById('usersPanel');
const userCount = document.getElementById('userCount');
const docTitle = document.getElementById('docTitle');
const outlinePanel = document.getElementById('outlinePanel');
const outlineToggleAll = document.getElementById('outlineToggleAll');

// ========== 初始化 ==========
async function init() {
  // 加载文档
  await loadDocument();
  // 建立WebSocket连接
  connectWS();
  // 监听编辑事件
  editor.addEventListener('input', onInput);
  editor.addEventListener('keyup', onCursorMove);
  editor.addEventListener('mouseup', onCursorMove);
  editor.addEventListener('scroll', renderCursors);
  editor.addEventListener('scroll', scheduleActiveOutline);
  window.addEventListener('resize', renderCursors);
  window.addEventListener('resize', scheduleOutlineRemeasure);

  // 自动大纲
  outlinePanel.addEventListener('click', onOutlineClick);
  outlineToggleAll.addEventListener('click', toggleAllOutline);
  updateOutlineToggleAllBtn();
  scheduleOutlineUpdate(true);
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => measureHeadingOffsets());
  }
}

async function loadDocument() {
  try {
    const res = await fetch(`/api/documents/${docId}/snapshot`);
    const data = await res.json();
    state.content = data.content || '';
    state.version = data.version || 0;
    editor.value = state.content;
    versionEl.textContent = state.version;
    
    // 获取文档标题
    const docRes = await fetch(`/api/documents/${docId}`);
    const docData = await docRes.json();
    docTitle.textContent = docData.title || '未命名文档';
  } catch (e) {
    console.error('加载文档失败:', e);
  }
}

// ========== WebSocket ==========
function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const url = `${proto}//${location.host}/ws?doc_id=${docId}&username=${encodeURIComponent(username)}`;
  
  state.ws = new WebSocket(url);
  
  state.ws.onopen = () => {
    console.log('WebSocket 已连接');
    statusEl.className = 'status-indicator connected';
    statusText.textContent = '已连接';
    state.reconnectAttempts = 0;
  };
  
  state.ws.onclose = () => {
    console.log('WebSocket 断开');
    statusEl.className = 'status-indicator disconnected';
    statusText.textContent = '重连中...';
    // 自动重连
    setTimeout(() => {
      state.reconnectAttempts++;
      if (state.reconnectAttempts < 10) {
        connectWS();
      }
    }, Math.min(1000 * state.reconnectAttempts, 10000));
  };
  
  state.ws.onerror = (e) => {
    console.error('WebSocket 错误:', e);
  };
  
  state.ws.onmessage = onMessage;
}

function onMessage(event) {
  try {
    const msg = JSON.parse(event.data);
    
    switch (msg.type) {
      case 'init':
        handleInit(msg);
        break;
      case 'op':
        handleRemoteOp(msg);
        break;
      case 'ack':
        handleAck(msg);
        break;
      case 'cursor_move':
        handleCursorMove(msg);
        break;
      case 'user_join':
        handleUserJoin(msg);
        break;
      case 'user_leave':
        handleUserLeave(msg);
        break;
      case 'error':
        console.error('服务器错误:', msg.error);
        break;
    }
  } catch (e) {
    console.error('解析消息失败:', e);
  }
}

function handleInit(msg) {
  state.clientId = msg.client_id;
  state.color = msg.color;
  
  // 使用服务器的内容（可能比我们加载的更新）
  if (msg.content !== undefined) {
    state.content = msg.content;
    editor.value = msg.content;
  }
  if (msg.version !== undefined) {
    state.version = msg.version;
    versionEl.textContent = msg.version;
  }

  // 内容可能与快照不同，刷新大纲
  scheduleOutlineUpdate(true);
  
  // 添加已有用户
  if (msg.users) {
    state.users = msg.users.filter(u => u.client_id !== state.clientId);
    renderUsers();
  }
  
  // 渲染已有光标
  if (msg.cursors) {
    msg.cursors.forEach(c => {
      if (c.client_id !== state.clientId) {
        state.remoteCursors[c.client_id] = { ...c };
      }
    });
    renderCursors();
  }
  
  console.log('初始化完成, clientId:', state.clientId, 'version:', state.version);
}

function handleRemoteOp(msg) {
  // 接收来自其他客户端的操作
  const op = msg.op;
  console.log('收到远端op:', op, 'version:', msg.version);

  // 应用到本地
  applyOpToEditor(op);

  state.version = msg.version;
  versionEl.textContent = state.version;

  // 远端协作者修改了文本（可能改动标题），实时刷新大纲
  scheduleOutlineUpdate();
}

function handleAck(msg) {
  // 服务器确认我们的操作
  console.log('收到ack, version:', msg.version);
  state.version = msg.version;
  versionEl.textContent = msg.version;
  // 清除对应的pang操作
  state.pendingOps = state.pendingOps.filter(o => o.version !== msg.version);
}

function handleCursorMove(msg) {
  if (msg.client_id === state.clientId) return;
  
  state.remoteCursors[msg.client_id] = {
    client_id: msg.client_id,
    username: msg.username,
    position: msg.position,
    color: msg.color
  };
  renderCursors();
}

function handleUserJoin(msg) {
  if (msg.client_id === state.clientId) return;
  
  if (!state.users.find(u => u.client_id === msg.client_id)) {
    state.users.push({
      client_id: msg.client_id,
      username: msg.username,
      color: msg.color
    });
  }
  renderUsers();
}

function handleUserLeave(msg) {
  state.users = state.users.filter(u => u.client_id !== msg.client_id);
  delete state.remoteCursors[msg.client_id];
  renderUsers();
  renderCursors();
}

// ========== 用户列表渲染 ==========
function renderUsers() {
  usersPanel.innerHTML = state.users.map(u => `
    <div class="user-chip" style="border-color:${u.color}">
      <div class="dot" style="background:${u.color}"></div>
      ${escapeHtml(u.username)}
    </div>
  `).join('');
  userCount.textContent = state.users.length + 1; // +1 自己
}

// ========== 光标渲染 ==========
function renderCursors() {
  // 清空
  cursorsLayer.innerHTML = '';
  
  Object.values(state.remoteCursors).forEach(cursor => {
    const pos = cursor.position;
    if (pos < 0 || pos > editor.value.length) return;
    
    // 计算位置（简化：按字符位置计算）
    const posInfo = getCaretCoordinates(editor, pos);
    
    const el = document.createElement('div');
    el.className = 'remote-cursor';
    el.style.background = cursor.color;
    el.style.top = posInfo.top + 'px';
    el.style.left = posInfo.left + 'px';
    el.style.height = posInfo.height + 'px';
    
    const label = document.createElement('div');
    label.className = 'remote-cursor-label';
    label.style.background = cursor.color;
    label.textContent = cursor.username;
    el.appendChild(label);
    
    cursorsLayer.appendChild(el);
  });
}

// 获取光标在textarea中的像素位置
function getCaretCoordinates(element, position) {
  // 创建一个镜像元素来计算位置
  const mirror = document.createElement('div');
  const style = window.getComputedStyle(element);
  
  // 复制样式
  const props = ['boxSizing', 'width', 'height', 'overflowX', 'overflowY',
    'borderTopWidth', 'borderRightWidth', 'borderBottomWidth', 'borderLeftWidth',
    'borderStyle', 'paddingTop', 'paddingRight', 'paddingBottom', 'paddingLeft',
    'fontStyle', 'fontVariant', 'fontWeight', 'fontStretch', 'fontSize',
    'fontSizeAdjust', 'lineHeight', 'fontFamily',
    'textAlign', 'textTransform', 'textIndent', 'textDecoration',
    'letterSpacing', 'wordSpacing', 'tabSize'];
  
  props.forEach(p => {
    mirror.style[p] = style[p];
  });
  
  mirror.style.position = 'absolute';
  mirror.style.top = '0';
  mirror.style.left = '0';
  mirror.style.visibility = 'hidden';
  mirror.style.whiteSpace = 'pre-wrap';
  mirror.style.wordWrap = 'break-word';
  
  // 设置内容
  const text = element.value.substring(0, position);
  const afterText = element.value.substring(position);
  mirror.textContent = text;
  
  const span = document.createElement('span');
  span.textContent = afterText || '.';
  mirror.appendChild(span);
  
  document.body.appendChild(mirror);
  
  const rect = element.getBoundingClientRect();
  const mirrorRect = mirror.getBoundingClientRect();
  const spanRect = span.getBoundingClientRect();
  
  document.body.removeChild(mirror);
  
  return {
    top: spanRect.top - mirrorRect.top - element.scrollTop,
    left: spanRect.left - mirrorRect.left - element.scrollLeft,
    height: parseInt(style.lineHeight) || parseInt(style.fontSize) * 1.2,
    width: 2
  };
}

// ========== 编辑器操作 ==========
function onInput(e) {
  // 计算差异，发送OT操作
  const newContent = editor.value;
  const oldContent = state.content;
  
  if (newContent === oldContent) return;
  
  const op = diffContent(oldContent, newContent);
  if (!op) return;
  
  // 发送操作（带base_version）
  sendOp(op, state.version);
  state.content = newContent;

  // 正文编辑后实时刷新大纲（标题增删/层级变化立即反映）
  scheduleOutlineUpdate();
}

function onCursorMove() {
  state.cursorPosition = editor.selectionStart;
  sendCursorPosition(state.cursorPosition);
  renderCursors();
}

function diffContent(oldContent, newContent) {
  // 简单的差异计算
  if (newContent.length > oldContent.length) {
    // 插入
    let diffStart = 0;
    while (diffStart < oldContent.length && diffStart < newContent.length) {
      if (oldContent[diffStart] !== newContent[diffStart]) break;
      diffStart++;
    }
    let diffEndOld = oldContent.length;
    let diffEndNew = newContent.length;
    while (diffEndOld > diffStart && diffEndNew > diffStart) {
      if (oldContent[diffEndOld - 1] !== newContent[diffEndNew - 1]) break;
      diffEndOld--;
      diffEndNew--;
    }
    
    // 在公共前缀之后有删除+插入
    const deletedText = oldContent.substring(diffStart, diffEndOld);
    const insertedText = newContent.substring(diffStart, diffEndNew);
    
    if (deletedText.length > 0) {
      return {
        operations: [
          { type: 'delete', position: diffStart, length: deletedText.length },
          { type: 'insert', position: diffStart, text: insertedText }
        ]
      };
    } else {
      return {
        operations: [
          { type: 'insert', position: diffStart, text: insertedText }
        ]
      };
    }
  } else if (newContent.length < oldContent.length) {
    // 删除
    let diffStart = 0;
    while (diffStart < oldContent.length && diffStart < newContent.length) {
      if (oldContent[diffStart] !== newContent[diffStart]) break;
      diffStart++;
    }
    
    let diffEndOld = oldContent.length;
    let diffEndNew = newContent.length;
    while (diffEndOld > diffStart && diffEndNew > diffStart) {
      if (oldContent[diffEndOld - 1] !== newContent[diffEndNew - 1]) break;
      diffEndOld--;
      diffEndNew--;
    }
    
    const deletedText = oldContent.substring(diffStart, diffEndOld);
    const insertedText = newContent.substring(diffStart, diffEndNew);
    
    if (insertedText.length > 0) {
      return {
        operations: [
          { type: 'delete', position: diffStart, length: deletedText.length },
          { type: 'insert', position: diffStart, text: insertedText }
        ]
      };
    } else {
      return {
        operations: [
          { type: 'delete', position: diffStart, length: deletedText.length }
        ]
      };
    }
  }
  return null;
}

function applyOpToEditor(op) {
  const operations = op.operations || [op];
  
  operations.forEach(o => {
    if (o.type === 'insert') {
      insertText(o.position, o.text);
    } else if (o.type === 'delete') {
      deleteText(o.position, o.length);
    }
  });
  
  state.content = editor.value;
}

function insertText(pos, text) {
  const before = editor.value.substring(0, pos);
  const after = editor.value.substring(pos);
  editor.value = before + text + after;
}

function deleteText(pos, length) {
  const before = editor.value.substring(0, pos);
  const after = editor.value.substring(pos + length);
  editor.value = before + after;
}

function sendOp(op, baseVersion) {
  if (!state.ws || state.ws.readyState !== WebSocket.OPEN) return;
  
  const msg = {
    type: 'op',
    doc_id: docId,
    op: op.operations && op.operations.length === 1 ? op.operations[0] : op,
    base_version: baseVersion,
    version: baseVersion
  };
  
  // 如果是多操作序列，逐个发送
  if (op.operations && op.operations.length > 1) {
    op.operations.forEach((singleOp, i) => {
      const singleMsg = { ...msg, op: singleOp };
      state.ws.send(JSON.stringify(singleMsg));
    });
  } else {
    state.ws.send(JSON.stringify(msg));
  }
}

function sendCursorPosition(pos) {
  if (!state.ws || state.ws.readyState !== WebSocket.OPEN) return;
  
  const msg = {
    type: 'cursor_move',
    doc_id: docId,
    position: pos
  };
  state.ws.send(JSON.stringify(msg));
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

// ========== 自动大纲 ==========
// 约定：Markdown ATX 标题（行首 0~3 空格 + 1~6 个 # + 空格 + 标题文字）。
// 大纲直接从当前正文派生：本地输入防抖刷新；远端 op 到达后同样刷新，
// 因此协作者修改标题时，所有人的侧边栏都会随之更新，无需额外协议。

const outline = {
  model: [],            // 扁平的标题节点数组
  offsets: [],          // 与 model 对应的正文像素偏移（相对内容原点）
  offsetByIdx: new Map(),
  collapsed: new Set(), // 折叠状态，按祖先序号链（如 "0>5>7"）持久标识
  activeIdx: -1,
  updateTimer: null,
  measureTimer: null,
  activeTimer: null,
};

const ATX_HEADING_RE = /^(?: {0,3})(#{1,6})(?:[ \t]+(.*?))?[ \t]*#*[ \t]*$/;
const FENCE_RE = /^\s*(`{3,}|~{3,})/;

// parseHeadings 扫描正文，返回 [{level, text, lineStart, contentStart, line}]
function parseHeadings(text) {
  const headings = [];
  const lines = text.split('\n');
  let pos = 0;
  let fenceMarker = null; // 代码围栏内的 # 不当作标题

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];

    if (fenceMarker) {
      if (line.trimStart().startsWith(fenceMarker)) fenceMarker = null;
    } else {
      const fence = line.match(FENCE_RE);
      if (fence) {
        fenceMarker = fence[1][0] === '`' ? '```' : '~~~';
      } else {
        const m = line.match(ATX_HEADING_RE);
        if (m) {
          const rawTitle = (m[2] || '').trim();
          if (rawTitle) {
            const hashStart = pos + (line.length - line.trimStart().length);
            headings.push({
              level: m[1].length,
              text: rawTitle,
              lineStart: pos,
              contentStart: hashStart + m[1].length + 1,
              line: i,
            });
          }
        }
      }
    }
    pos += line.length + 1; // \n
  }
  return headings;
}

// buildOutlineModel 把扁平标题列表转成带层级/可见性的模型
function buildOutlineModel(headings) {
  const model = [];
  const stack = []; // 祖先栈：[{idx(标题序号), level, path}]
  const keyCount = new Map(); // 同一完整路径下的出现次数，用于同名标题去重

  headings.forEach((h, i) => {
    while (stack.length && stack[stack.length - 1].level >= h.level) {
      stack.pop();
    }
    const depth = stack.length;
    const parentPath = stack.map(s => headings[s.idx].text).join('>');
    let path = parentPath ? parentPath + '>' + h.text : h.text;
    // 同父级下允许同名标题，追加出现序号区分
    const seen = (keyCount.get(path) || 0) + 1;
    keyCount.set(path, seen);
    if (seen > 1) path += '#' + seen;

    // 栈顶即直接父节点
    if (stack.length) model[stack[stack.length - 1].idx].hasChild = true;

    model.push({
      ...h,
      idx: i,
      depth,
      path,
      hasChild: false,
      hidden: false,
      collapsed: false,
    });
    stack.push({ idx: i, level: h.level, path });
  });

  // 计算折叠产生的可见性
  const collapsedDepths = []; // 当前隐藏区域内折叠点的深度
  model.forEach(item => {
    while (collapsedDepths.length && collapsedDepths[collapsedDepths.length - 1] >= item.depth) {
      collapsedDepths.pop();
    }
    item.hidden = collapsedDepths.length > 0;
    item.collapsed = outline.collapsed.has(item.path);
    if (item.collapsed) collapsedDepths.push(item.depth);
  });

  return model;
}

function renderOutline() {
  const headings = parseHeadings(editor.value);
  outline.model = buildOutlineModel(headings);

  if (headings.length === 0) {
    outlinePanel.innerHTML =
      '<div class="outline-empty">暂无标题<br>在行首输入 <code># 标题</code> 即可自动生成大纲（支持 ## ~ ###### 多级）</div>';
    outline.offsets = [];
    outline.offsetByIdx.clear();
    outline.activeIdx = -1;
    updateOutlineToggleAllBtn();
    return;
  }

  const frag = document.createDocumentFragment();
  outline.model.forEach(item => {
    const div = document.createElement('div');
    div.className = 'outline-item'
      + ' lvl-' + Math.min(item.level, 6)
      + (item.hidden ? ' hidden' : '');
    div.style.paddingLeft = (6 + item.depth * 13) + 'px';
    div.dataset.idx = item.idx;
    div.title = 'H' + item.level + ' · ' + item.text;

    const arrow = document.createElement('span');
    arrow.className = 'outline-arrow'
      + (item.hasChild ? (item.collapsed ? ' collapsed' : '') : ' leaf');
    arrow.textContent = item.hasChild ? '▼' : '•';
    div.appendChild(arrow);

    const label = document.createElement('span');
    label.className = 'outline-label';
    label.textContent = item.text;
    div.appendChild(label);

    frag.appendChild(div);
  });
  outlinePanel.innerHTML = '';
  outlinePanel.appendChild(frag);

  updateOutlineToggleAllBtn();
  measureHeadingOffsets();
  updateActiveOutline();
}

// measureHeadingOffsets 用与 textarea 同版式的镜像元素一次性测出
// 每个标题行相对正文内容原点的 y 偏移（自动考虑自动换行）
function measureHeadingOffsets() {
  const headings = outline.model;
  outline.offsets = [];
  outline.offsetByIdx.clear();
  if (!headings || headings.length === 0) return;

  const style = window.getComputedStyle(editor);
  const mirror = document.createElement('div');
  const props = ['boxSizing', 'borderTopWidth', 'borderRightWidth',
    'borderBottomWidth', 'borderLeftWidth', 'borderStyle',
    'paddingTop', 'paddingRight', 'paddingBottom', 'paddingLeft',
    'fontStyle', 'fontVariant', 'fontWeight', 'fontStretch', 'fontSize',
    'fontSizeAdjust', 'lineHeight', 'fontFamily',
    'textAlign', 'textTransform', 'textIndent', 'textDecoration',
    'letterSpacing', 'wordSpacing', 'tabSize'];
  props.forEach(p => { mirror.style[p] = style[p]; });
  mirror.style.position = 'absolute';
  mirror.style.top = '0';
  mirror.style.left = '-9999px';
  mirror.style.visibility = 'hidden';
  // 下面 width 直接赋值为正文内容区宽度，必须用 content-box
  mirror.style.boxSizing = 'content-box';
  mirror.style.border = 'none';
  mirror.style.whiteSpace = 'pre-wrap';
  mirror.style.wordWrap = 'break-word';
  mirror.style.overflowWrap = 'break-word';
  mirror.style.overflow = 'hidden';
  mirror.style.height = 'auto';

  const contentWidth = editor.clientWidth
    - (parseFloat(style.paddingLeft) || 0)
    - (parseFloat(style.paddingRight) || 0);
  mirror.style.width = contentWidth + 'px';

  const text = editor.value;
  const positions = headings.map(h => h.lineStart).sort((a, b) => a - b);
  const markers = new Map();

  let cursor = 0;
  positions.forEach(pos => {
    if (pos < cursor) return;
    mirror.appendChild(document.createTextNode(text.slice(cursor, pos)));
    const marker = document.createElement('span');
    marker.textContent = '​'; // 零宽空格，不改变排版
    mirror.appendChild(marker);
    markers.set(pos, marker);
    cursor = pos;
  });
  mirror.appendChild(document.createTextNode(text.slice(cursor)));

  document.body.appendChild(mirror);
  const mirrorRect = mirror.getBoundingClientRect();

  headings.forEach(h => {
    const marker = markers.get(h.lineStart);
    const absY = marker ? marker.getBoundingClientRect().top - mirrorRect.top : 0;
    // 换算成相对正文内容原点（不含 padding）的偏移
    const y = absY - (parseFloat(style.paddingTop) || 0);
    outline.offsets.push(y);
    outline.offsetByIdx.set(h.idx, y);
  });

  document.body.removeChild(mirror);
}

// updateActiveOutline 根据滚动位置高亮当前所在章节
function updateActiveOutline() {
  if (!outline.model.length) return;

  const padTop = parseFloat(getComputedStyle(editor).paddingTop) || 0;
  const lineH = parseFloat(getComputedStyle(editor).lineHeight) || 27;
  // 判定线相对正文内容原点的位置（留约三分之一行高的余量）
  const threshold = editor.scrollTop + padTop + Math.max(8, lineH * 0.35);

  let activeIdx = -1;
  outline.model.forEach(h => {
    const y = outline.offsetByIdx.get(h.idx);
    if (y === undefined) return;
    if (y <= threshold) activeIdx = h.idx;
  });
  if (activeIdx === -1 && outline.model.length) activeIdx = outline.model[0].idx;

  // 当前标题被折叠隐藏时，高亮其最近的可见祖先
  let target = outline.model.find(h => h.idx === activeIdx);
  if (target && target.hidden) {
    for (let i = outline.model.indexOf(target) - 1; i >= 0; i--) {
      if (!outline.model[i].hidden && outline.model[i].depth < target.depth) {
        target = outline.model[i];
        break;
      }
    }
  }
  if (!target) return;

  if (target.idx !== outline.activeIdx) {
    outline.activeIdx = target.idx;
    outlinePanel.querySelectorAll('.outline-item').forEach(el => {
      el.classList.toggle('active', Number(el.dataset.idx) === target.idx);
    });
  }

  // 把高亮项保持在大纲面板可视范围内
  const activeEl = outlinePanel.querySelector('.outline-item.active');
  if (activeEl) {
    const panelRect = outlinePanel.getBoundingClientRect();
    const elRect = activeEl.getBoundingClientRect();
    if (elRect.top < panelRect.top + 4) {
      outlinePanel.scrollTop -= (panelRect.top + 4 - elRect.top);
    } else if (elRect.bottom > panelRect.bottom - 4) {
      outlinePanel.scrollTop += (elRect.bottom - panelRect.bottom + 4);
    }
  }
}

function onOutlineClick(e) {
  const itemEl = e.target.closest('.outline-item');
  if (!itemEl) return;
  const idx = Number(itemEl.dataset.idx);

  // 点箭头：折叠/展开
  if (e.target.classList.contains('outline-arrow') && !e.target.classList.contains('leaf')) {
    toggleOutlineItem(idx);
    return;
  }
  jumpToHeading(idx);
}

function toggleOutlineItem(idx) {
  const item = outline.model.find(h => h.idx === idx);
  if (!item || !item.hasChild) return;
  if (outline.collapsed.has(item.path)) outline.collapsed.delete(item.path);
  else outline.collapsed.add(item.path);
  renderOutline();
}

function toggleAllOutline() {
  const expandable = outline.model.filter(h => h.hasChild);
  if (!expandable.length) return;
  const allCollapsed = expandable.every(h => outline.collapsed.has(h.path));
  if (allCollapsed) {
    expandable.forEach(h => outline.collapsed.delete(h.path));
  } else {
    expandable.forEach(h => outline.collapsed.add(h.path));
  }
  renderOutline();
}

function updateOutlineToggleAllBtn() {
  const expandable = outline.model.filter(h => h.hasChild);
  const allCollapsed = expandable.length > 0
    && expandable.every(h => outline.collapsed.has(h.path));
  outlineToggleAll.textContent = allCollapsed ? '全部展开' : '全部折叠';
  outlineToggleAll.style.visibility = expandable.length ? 'visible' : 'hidden';
}

// jumpToHeading 把对应标题行滚动到正文顶部并定位光标
function jumpToHeading(idx) {
  const item = outline.model.find(h => h.idx === idx);
  if (!item) return;
  if (outline.offsetByIdx.size === 0) measureHeadingOffsets();

  const y = outline.offsetByIdx.get(item.idx);
  editor.focus();
  const caret = Math.min(item.contentStart, editor.value.length);
  editor.setSelectionRange(caret, caret);
  state.cursorPosition = caret;
  sendCursorPosition(caret);
  // 光标定位后再设置滚动位置，避免浏览器自动滚动覆盖
  if (y !== undefined) {
    // y 是相对内容原点的偏移，让标题停在距视口顶部 8px 处
    editor.scrollTop = Math.max(0, y - 8);
  }
  updateActiveOutline();
}

function scheduleOutlineUpdate(immediate) {
  clearTimeout(outline.updateTimer);
  if (immediate) {
    renderOutline();
    return;
  }
  outline.updateTimer = setTimeout(renderOutline, 120);
}

function scheduleOutlineRemeasure() {
  clearTimeout(outline.measureTimer);
  outline.measureTimer = setTimeout(() => {
    measureHeadingOffsets();
    updateActiveOutline();
  }, 150);
}

function scheduleActiveOutline() {
  if (outline.activeTimer) return;
  outline.activeTimer = requestAnimationFrame(() => {
    outline.activeTimer = null;
    updateActiveOutline();
  });
}

// 启动
init();
</script>
</body>
</html>
